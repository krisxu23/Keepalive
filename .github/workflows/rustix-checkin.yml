name: rustix-auto-alive

on:
  schedule:
    - cron: '0 */6 * * *' # 每 6 小时
  workflow_dispatch:
  repository_dispatch:
    types: [cloudflare_cron_trigger]

jobs:
  rustix-alive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: ⚙ 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 🛠 安装系统依赖和 Python 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils xdotool scrot fonts-noto-cjk jq wget
          pip install -r rustix-auto/requirements.txt
          seleniumbase install chromedriver

      # 可选：配置 NODE_LINK secret（节点链接）后，浏览器流量经 sing-box 节点出口
      # 访问 my.rustix.me。未配置时自动直连，不影响流程。
      - name: ⚙ 设置代理 (sing-box)
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)

      - name: 🚀 运行自动启动脚本 (seleniumbase UC)
        working-directory: rustix-auto
        env:
          ACCOUNTS: ${{ secrets.RUSTIX_ACCOUNTS }}
          RUSTIX_COOKIE: ${{ secrets.RUSTIX_COOKIE }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          # Mitelis 挑战会拖死无头/自动化浏览器：uc 模式 + 有头（xvfb 虚拟显示）
          xvfb-run --auto-servernum python3 main.py

      - name: 🧽 清理进程
        if: always()
        run: |
          pkill -f sing-box || true
          pkill -f chromedriver || true
          pkill -f chrome || true
          pkill -f Xvfb || true
          rm -f sing-box sing-box-config.json sing-box.log

      - name: 📦 上传运行日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-log
          path: |
            rustix-auto/run.log
            rustix-auto/debug_*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: 🧹 清理旧 Workflow 运行记录
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
          count=0
          for id in $(echo "$runs" | head -n -1); do
            gh run delete "$id" --yes && count=$((count+1))
          done
          echo "已删除 $count 条旧运行记录"
